# Split battery: the left (central) half reads the right half's battery level
# and exposes it to the host as a second Battery Service instance.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Spare layer slots so ZMK Studio can add layers at runtime (default is 0).
CONFIG_ZMK_KEYMAP_LAYERS_EXTRA=4
